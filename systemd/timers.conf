# =============================================================================
# Oracle Data Audit & Forensics Appliance — Timers systemd
# Copier chaque bloc dans son fichier .timer sous /etc/systemd/system/
# =============================================================================

# ── audit-archive.timer ───────────────────────────────────────────────────────
# Archivage des partitions PostgreSQL — quotidien à 02:00
# Fichier : /etc/systemd/system/audit-archive.timer

# [Unit]
# Description=Oracle Data Audit — Archive (daily 02:00)
# [Timer]
# OnCalendar=*-*-* 02:00:00
# Persistent=true
# RandomizedDelaySec=300
# [Install]
# WantedBy=timers.target


# ── audit-backup.timer ────────────────────────────────────────────────────────
# Backup PostgreSQL + configuration — quotidien à 01:00
# Fichier : /etc/systemd/system/audit-backup.timer

# [Unit]
# Description=Oracle Data Audit — Backup (daily 01:00)
# [Timer]
# OnCalendar=*-*-* 01:00:00
# Persistent=true
# RandomizedDelaySec=300
# [Install]
# WantedBy=timers.target


# ── audit-partition.timer ─────────────────────────────────────────────────────
# Création des partitions PostgreSQL futures — hebdomadaire lundi 00:30
# Fichier : /etc/systemd/system/audit-partition.timer

# [Unit]
# Description=Oracle Data Audit — Partition manager (weekly)
# [Timer]
# OnCalendar=Mon *-*-* 00:30:00
# Persistent=true
# [Install]
# WantedBy=timers.target


# ── audit-integrity.timer ─────────────────────────────────────────────────────
# Vérification de la chaîne SHA-256 — toutes les 6 heures
# Fichier : /etc/systemd/system/audit-integrity.timer

# [Unit]
# Description=Oracle Data Audit — Integrity check (every 6h)
# [Timer]
# OnCalendar=*-*-* 00,06,12,18:00:00
# Persistent=true
# [Install]
# WantedBy=timers.target


# ── audit-idempotency-cleanup.timer ──────────────────────────────────────────
# Nettoyage des clés d'idempotence > 30 jours — hebdomadaire
# Fichier : /etc/systemd/system/audit-idempotency-cleanup.timer

# [Unit]
# Description=Oracle Data Audit — Idempotency keys cleanup (weekly)
# [Timer]
# OnCalendar=Sun *-*-* 03:00:00
# Persistent=true
# [Install]
# WantedBy=timers.target
