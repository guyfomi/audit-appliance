# =============================================================================
# Oracle Data Audit & Forensics Appliance — Nginx configuration
# =============================================================================

# Zone de rate limiting : 60 requêtes/minute par IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# Redirection HTTP → HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Health check pour load balancer (sans redirection)
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Serveur HTTPS principal
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /opt/audit-appliance/ssl/cert.pem;
    ssl_certificate_key /opt/audit-appliance/ssl/key.pem;

    # Protocoles et ciphers modernes
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Session TLS
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling (désactiver si certificat auto-signé)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # ── Headers de sécurité ───────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Masquer la version Nginx
    server_tokens off;

    # ── Interface Web (React SPA) ─────────────────────────────────────────────
    root /opt/audit-appliance/ui/dist;
    index index.html;

    # Cache des assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback : toutes les routes non-API → index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── API REST ──────────────────────────────────────────────────────────────
    location /api/ {
        # Rate limiting général
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Headers proxy
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;

        # Buffer
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      4 32k;

        # Ne pas exposer les erreurs internes
        proxy_intercept_errors on;
        error_page 500 502 503 504 /50x.html;
    }

    # Rate limiting plus strict pour l'authentification
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check sans authentification
    location /api/v1/health {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Pages d'erreur ────────────────────────────────────────────────────────
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/audit-appliance-access.log combined;
    error_log  /var/log/nginx/audit-appliance-error.log warn;

    # ── Sécurité supplémentaire ───────────────────────────────────────────────
    # Bloquer l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquer les fichiers de configuration
    location ~* \.(env|conf|ini|log|bak|sql)$ {
        deny all;
        return 404;
    }

    # Taille maximale des requêtes
    client_max_body_size 10m;
}
